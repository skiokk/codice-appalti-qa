- id: Q001
  question: "Cosa significa in pratica il principio del risultato per una stazione appaltante?"
  kind: answerable
  category: principi
  vigenza: "2026-10-11"
  expected_answer: "Le stazioni appaltanti e gli enti concedenti devono perseguire il risultato dell'affidamento e dell'esecuzione del contratto con la massima tempestività e il miglior rapporto possibile tra qualità e prezzo, sempre nel rispetto dei principi di legalità, trasparenza e concorrenza."
  expected_refs: ["1/1"]
  source_excerpt: "Le stazioni appaltanti e gli enti concedenti perseguono il risultato dell'affidamento del contratto e della sua esecuzione con la massima tempestivita' e il migliore rapporto possibile tra qualita' e prezzo, nel rispetto dei principi di legalita', trasparenza e concorrenza."
  difficulty: easy
  status: bozza
  notes: ""

- id: Q002
  question: "Ai fini della responsabilità amministrativa del funzionario che gestisce una gara, quando c'è colpa grave e quando invece no?"
  kind: answerable
  category: principi
  vigenza: "2026-10-11"
  expected_answer: "Costituisce colpa grave la violazione di norme di diritto e degli auto-vincoli amministrativi, la palese violazione di regole di prudenza, perizia e diligenza e l'omissione delle cautele e verifiche normalmente richieste. Non costituisce colpa grave la violazione o l'omissione dovuta all'aver seguito indirizzi giurisprudenziali prevalenti o pareri delle autorità competenti."
  expected_refs: ["2/3"]
  source_excerpt: "Non costituisce colpa grave la violazione o l'omissione determinata dal riferimento a indirizzi giurisprudenziali prevalenti o a pareri delle autorita' competenti."
  difficulty: hard
  status: bozza
  notes: ""

- id: Q003
  question: "Quali principi deve rispettare la stazione appaltante per favorire l'accesso al mercato degli operatori economici?"
  kind: answerable
  category: principi
  vigenza: "2026-10-11"
  expected_answer: "L'accesso al mercato va favorito nel rispetto dei principi di concorrenza, imparzialità, non discriminazione, pubblicità e trasparenza e proporzionalità, secondo le modalità indicate dal codice."
  expected_refs: ["3/1"]
  source_excerpt: "favoriscono, secondo le modalita' indicate dal codice, l'accesso al mercato degli operatori economici nel rispetto dei principi di concorrenza, di imparzialita', di non discriminazione, di pubblicita' e trasparenza, di proporzionalita'."
  difficulty: easy
  status: bozza
  notes: ""

- id: Q004
  question: "Se durante l'esecuzione un evento straordinario e imprevedibile stravolge l'equilibrio del contratto, l'appaltatore può chiedere di rinegoziare? Con quali risorse si pagano gli oneri?"
  kind: answerable
  category: esecuzione
  vigenza: "2026-10-11"
  expected_answer: "Sì: se circostanze straordinarie e imprevedibili, estranee alla normale alea, alterano in modo rilevante l'equilibrio originario, la parte svantaggiata che non ha assunto volontariamente il rischio ha diritto alla rinegoziazione secondo buona fede. Gli oneri sono riconosciuti all'esecutore sulle somme a disposizione del quadro economico (imprevisti e accantonamenti) e, se necessario, sulle economie da ribasso d'asta."
  expected_refs: ["9/1"]
  source_excerpt: "Gli oneri per la rinegoziazione sono riconosciuti all'esecutore a valere sulle somme a disposizione indicate nel quadro economico dell'intervento, alle voci imprevisti e accantonamenti e, se necessario, anche utilizzando le economie da ribasso d'asta."
  difficulty: medium
  status: bozza
  notes: ""

- id: Q005
  question: "Partecipo a una gara di servizi ma applico ai miei dipendenti un CCNL diverso da quello indicato nel bando: posso farlo?"
  kind: answerable
  category: principi
  vigenza: "2026-10-11"
  expected_answer: "Sì, l'operatore economico può indicare nell'offerta un contratto collettivo diverso da quello indicato dalla stazione appaltante, purché garantisca ai dipendenti le stesse tutele."
  expected_refs: ["11/3"]
  source_excerpt: "gli operatori economici possono indicare nella propria offerta il differente contratto collettivo da essi applicato, purche' garantisca ai dipendenti le stesse tutele di quello indicato dalla stazione appaltante o dall'ente concedente."
  difficulty: medium
  status: bozza
  notes: "Comma 4 adds the declaration of equivalence verified under art. 110."

- id: Q006
