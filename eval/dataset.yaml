- id: Q019
  question: "In quali casi il principio di rotazione vieta di affidare un nuovo appalto al contraente uscente?"
  kind: answerable
  category: rotazione
  vigenza: "2026-10-11"
  expected_answer: "È vietato affidare o aggiudicare l'appalto al contraente uscente quando due affidamenti consecutivi hanno a oggetto una commessa dello stesso settore merceologico, della stessa categoria di opere o dello stesso settore di servizi."
  expected_refs: ["49/2"]
  source_excerpt: "In applicazione del principio di rotazione e' vietato l'affidamento o l'aggiudicazione di un appalto al contraente uscente nei casi in cui due consecutivi affidamenti abbiano a oggetto una commessa rientrante nello stesso settore merceologico"
  difficulty: medium
  status: bozza
  notes: "Reworded from 'mi impedisce di riaffidare al fornitore uscente?': a yes/no answer also needs the exceptions of commi 4 (motivated cases) and 6 (direct awards under 5.000 euro, see Q073), which comma 2 alone does not support."

