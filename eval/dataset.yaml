  kind: multi
  category: contenzioso
  vigenza: "2026-10-11"
  expected_answer: "L'accordo bonario si applica quando le riserve possono far variare l'importo dell'opera tra il 5 e il 15 per cento del contratto e riguarda tutte le riserve iscritte fino all'avvio del procedimento. La proposta, formulata dall'esperto o dal RUP, si intende conclusa come accordo se accettata dalle parti entro quarantacinque giorni dal ricevimento; l'accordo ha natura di transazione."
  expected_refs: ["210/1", "210/2", "210/6"]
