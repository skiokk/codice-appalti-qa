- id: Q081
  question: "Per un appalto di lavori da 2 milioni di euro chi posso nominare RUP e quanta esperienza deve avere?"
  kind: multi
  category: rup
  vigenza: "2026-10-11"
  expected_answer: "Il RUP è nominato tra i dipendenti, anche a tempo determinato, della stazione appaltante con i requisiti dell'allegato I.2 (o, se manca personale con quei requisiti, tra i dipendenti di altre amministrazioni). Per i lavori deve essere un tecnico abilitato con almeno tre anni di esperienza in attività analoghe per i contratti tra 1 milione e la soglia europea; se non è abilitato, deve avere almeno cinque anni di esperienza nel settore."
  expected_refs: ["15/2", "all:I.2/4/1", "all:I.2/4/2"]
  source_excerpt: "b) di almeno tre anni per i contratti di importo pari o superiore a 1.000.000 di euro e inferiore alla soglia di cui all'articolo 14 del codice;"
  difficulty: hard
  status: bozza
  notes: "Allegato I.2, art. 4, comma 1, lett. b) and comma 2. Added comma 2: without a professional licence the minimum is five years, not three. Comma 4 (lavori particolarmente complessi) is not assumed."
