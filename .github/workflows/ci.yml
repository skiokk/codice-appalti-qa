name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: appalti
          POSTGRES_USER: appalti
          POSTGRES_PASSWORD: appalti
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U appalti -d appalti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://appalti:appalti@localhost:5433/appalti
      TEST_DATABASE_ADMIN_URL: postgresql://appalti:appalti@localhost:5433/appalti
      LLM_PROVIDER: fake
      JUDGE_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -m "not slow"
