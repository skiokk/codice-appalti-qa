services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: appalti
      POSTGRES_USER: appalti
      POSTGRES_PASSWORD: appalti
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appalti -d appalti"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://appalti:appalti@db:5432/appalti
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/home/app/.cache/huggingface
      - ./data:/app/data
      - ./eval:/app/eval
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
